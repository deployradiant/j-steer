[project]
name = "j-steer"
version = "0.1.0"
description = "A demo control plane for monitoring and steering Qwen hidden-state activations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.0.0",
  "fastapi>=0.115.0",
  "huggingface-hub>=0.33.0",
  "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
  "modal>=1.0.0",
  "pydantic>=2.9.0",
  "safetensors>=0.4.5",
  "sentencepiece>=0.2.0",
  "torch>=2.5.0",
  "transformers>=5.14.1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsteer"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
